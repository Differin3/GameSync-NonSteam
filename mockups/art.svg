<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2a1c"/>
      <stop offset=".45" stop-color="#16222c"/>
      <stop offset="1" stop-color="#080b0e"/>
    </linearGradient>
    <radialGradient id="sun" cx=".72" cy=".28" r=".42">
      <stop offset="0" stop-color="#f5c85a" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#e09a3a" stop-opacity=".18"/>
      <stop offset="1" stop-color="#e09a3a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fd0ff" stop-opacity=".10"/>
      <stop offset=".6" stop-color="#3fd0ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="800" fill="url(#sky)"/>
  <rect width="1280" height="800" fill="url(#sun)"/>
  <rect width="1280" height="800" fill="url(#haze)"/>

  <!-- дальний план -->
  <g fill="#0d151c" opacity=".85">
    <rect x="0" y="470" width="70" height="330"/>
    <rect x="80" y="510" width="54" height="290"/>
    <rect x="144" y="440" width="86" height="360"/>
    <rect x="240" y="500" width="60" height="300"/>
    <rect x="310" y="455" width="96" height="345"/>
    <rect x="416" y="520" width="58" height="280"/>
    <rect x="484" y="430" width="74" height="370"/>
    <rect x="568" y="495" width="52" height="305"/>
    <rect x="630" y="450" width="90" height="350"/>
    <rect x="730" y="515" width="58" height="285"/>
    <rect x="798" y="470" width="84" height="330"/>
    <rect x="892" y="430" width="64" height="370"/>
    <rect x="966" y="500" width="92" height="300"/>
    <rect x="1068" y="455" width="66" height="345"/>
    <rect x="1144" y="520" width="80" height="280"/>
    <rect x="1234" y="470" width="46" height="330"/>
  </g>

  <!-- ближний план -->
  <g fill="#05080b">
    <rect x="-10" y="600" width="140" height="210"/>
    <rect x="140" y="640" width="110" height="170"/>
    <rect x="260" y="580" width="150" height="230"/>
    <rect x="420" y="630" width="120" height="180"/>
    <rect x="550" y="560" width="170" height="250"/>
    <rect x="730" y="620" width="140" height="190"/>
    <rect x="880" y="590" width="120" height="220"/>
    <rect x="1010" y="640" width="150" height="170"/>
    <rect x="1170" y="600" width="120" height="210"/>
  </g>

  <!-- окна -->
  <g fill="#e8c06a" opacity=".55">
    <rect x="300" y="610" width="6" height="10"/><rect x="320" y="610" width="6" height="10"/>
    <rect x="340" y="636" width="6" height="10"/><rect x="300" y="636" width="6" height="10"/>
    <rect x="600" y="600" width="6" height="10"/><rect x="626" y="600" width="6" height="10"/>
    <rect x="600" y="626" width="6" height="10"/><rect x="680" y="680" width="6" height="10"/>
    <rect x="910" y="620" width="6" height="10"/><rect x="936" y="620" width="6" height="10"/>
    <rect x="910" y="650" width="6" height="10"/><rect x="1200" y="630" width="6" height="10"/>
  </g>

  <g fill="#7fd0ff" opacity=".35">
    <rect x="480" y="470" width="4" height="8"/><rect x="500" y="500" width="4" height="8"/>
    <rect x="810" y="500" width="4" height="8"/><rect x="1080" y="490" width="4" height="8"/>
    <rect x="200" y="540" width="4" height="8"/><rect x="640" y="480" width="4" height="8"/>
  </g>

  <!-- дымка у горизонта -->
  <rect x="0" y="420" width="1280" height="120" fill="#f0be50" opacity=".05"/>

  <!-- блики -->
  <g stroke="#ffffff" stroke-opacity=".05" stroke-width="2">
    <line x1="120" y1="-40" x2="420" y2="840"/>
    <line x1="240" y1="-40" x2="540" y2="840"/>
    <line x1="980" y1="-40" x2="1280" y2="840"/>

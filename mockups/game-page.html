<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>GameSync — страница non-Steam игры</title>
<link rel="stylesheet" href="styles.css">
<style>
  .gp-art{opacity:1;background:none}
  .gp-art:before{content:"";position:absolute;inset:0;background:url("art.svg") center/cover no-repeat;opacity:.95}
  .gp-art:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,12,.55) 0%,rgba(6,9,12,0) 28%,rgba(6,9,12,.15) 62%,rgba(6,9,12,.8) 100%)}

  .gp-main{position:relative;flex:1}
  .gp-bottom{position:absolute;left:46px;right:46px;bottom:34px;display:flex;align-items:flex-end;justify-content:space-between;gap:44px}
  .gp-info{max-width:660px}
  .gp-info .gp-title{font-size:50px;line-height:1.02;letter-spacing:.5px}
  .gp-chips{display:flex;align-items:center;gap:9px;margin-top:14px;flex-wrap:wrap}
  .gp-chips .c{font-size:11px;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.12);color:#d5e2ea}
  .gp-side{width:322px;display:flex;flex-direction:column;gap:9px;flex:0 0 auto}
  .play{font-size:15px;padding:16px 18px;letter-spacing:1.8px}
  .ghost-row{display:flex;gap:9px}
  .ghost.small{flex:1;padding:10px;font-size:11.5px;display:flex;align-items:center;justify-content:center;gap:7px}
  .gs-chip{padding:11px 12px;border-radius:7px}
  .note{display:flex;align-items:center;gap:8px;justify-content:flex-end;font-size:10.5px;color:#9fd4ff;margin-top:1px}
  .note:after{content:"";width:30px;height:1px;background:linear-gradient(90deg,#9fd4ff,transparent)}
  .lib-preview{position:absolute;top:70px;right:46px;width:196px}
  .lib-tile{position:relative;width:196px;height:110px;border-radius:7px;overflow:hidden;
    background:radial-gradient(140px 80px at 25% 10%,rgba(240,190,80,.55),transparent 70%),
               linear-gradient(140deg,#2a2410,#101a26 55%,#0b1118);
    border:1px solid rgba(255,255,255,.1);box-shadow:0 12px 34px rgba(0,0,0,.55)}
  .lib-tile:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.03) 0 2px,transparent 2px 22px)}
  .lib-tile .t{position:absolute;left:10px;bottom:8px;font-size:11px;font-weight:600;color:#eef4f8;text-shadow:0 2px 10px #000;z-index:2}
  .lib-tile .b{position:absolute;top:7px;right:7px;width:22px;height:22px;border-radius:50%;background:rgba(8,14,20,.8);border:1px solid rgba(102,192,244,.55);display:flex;align-items:center;justify-content:center;color:#7fd0ff;z-index:2}
  .lib-tile .b svg{width:12px;height:12px}
  .lib-caption{margin-top:7px;font-size:10px;color:#9fb3bf;display:flex;align-items:center;gap:6px}
  .lib-caption b{color:#9fd4ff;font-weight:600}
</style>
</head>
<body>
<div class="screen">
  <div class="gp-hero"></div>
  <div class="gp-art"></div>

  <div class="gp-frame">
    <div class="gp-top">
      <div class="back"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg></div>
      <div class="t">Библиотека · Cyberpunk 2077</div>
    </div>

    <div class="gp-main">
      <div class="lib-preview">
        <div class="lib-tile">
          <div class="b"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.4 10a7.4 7.4 0 0 0-14.8 0A5 5 0 0 0 6 20h13a4.5 4.5 0 0 0 .4-10z"/></svg></div>
          <div class="t">Cyberpunk 2077</div>
        </div>
        <div class="lib-caption"><b>новый значок</b> на плитке библиотеки</div>
      </div>

      <div class="gp-bottom">
        <div class="gp-info">
          <div class="gp-title">CYBERPUNK<br>2077</div>
          <div class="gp-chips">
            <span class="c">PortProton</span>
            <span class="c">Windows-игра</span>
            <span class="c">non-Steam</span>
            <span class="c">последний запуск: сегодня</span>
          </div>
        </div>

        <div class="gp-side">
          <div class="play">ИГРАТЬ</div>
          <div class="ghost-row">
            <div class="ghost small">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-2h2zm0-4h-2V7h2z"/></svg>
              Свойства
            </div>
            <div class="ghost small">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M12 2 4 6v6c0 5 3.4 9.4 8 10 4.6-.6 8-5 8-10V6z"/></svg>
              DLC
            </div>
          </div>

          <div class="gs-chip">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.4 10a7.4 7.4 0 0 0-14.8 0A5 5 0 0 0 6 20h13a4.5 4.5 0 0 0 .4-10zM12 18l-3.2-3.2 1.4-1.4 1.8 1.8 4-4 1.4 1.4z"/></svg>
            <div class="t"><b>GameSync</b><span>Сейвы: 5 минут назад</span></div>
            <span class="st">синхронизировано</span>
          </div>
          <div class="note">новый блок на странице игры</div>

          <div class="ghost">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" style="vertical-align:-2px;margin-right:6px"><path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
            Синхронизировать сейчас
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
